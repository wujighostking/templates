appId: com.example.template-electron
productName: Template Electron
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
